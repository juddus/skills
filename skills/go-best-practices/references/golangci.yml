# Fallback golangci-lint config for repos without their own linter setup.
# Mirrors the go-best-practices rules; see references/tooling.md.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - containedctx
    - errname
    - errorlint
    - gocognit
    - gocritic
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocognit:
      min-complexity: 20
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocognit
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
